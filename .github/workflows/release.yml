name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read version from manifest.json
        id: version
        run: |
          raw_version=$(jq -r '.version' manifest.json)
          if [[ -z "$raw_version" || "$raw_version" == "null" ]]; then
            echo "Invalid version in manifest.json" >&2
            exit 1
          fi
          echo "version=$raw_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$raw_version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: make package

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" "dist/black-screen-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
