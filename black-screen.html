<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Black Screen</title>
    <link rel="icon" type="image/png" href="images/icon-128.png" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* The only two text/icon colors used anywhere on the page. */
            --color-text: rgba(255, 255, 255, 0.6);
            --color-text-hover: rgba(255, 255, 255, 0.8);
            /* The <meta name="color-scheme"> tag alone doesn't reliably
               darken native popups (e.g. the <select> options list) —
               this is what actually does it. */
            color-scheme: dark;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            cursor: none;
        }

        body.active {
            cursor: default;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 2;
        }

        body.active .top-bar,
        .top-bar:focus-within {
            opacity: 1;
            pointer-events: auto;
            transition-duration: 0.3s;
        }

        .icon-button {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.25em;
            height: 2.25em;
            border: none;
            border-radius: 0.4em;
            background: transparent;
            color: var(--color-text);
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .icon-button svg {
            width: 1.25em;
            height: 1.25em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-button:hover,
        .icon-button:focus-visible,
        .icon-button:active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-text-hover);
            outline: none;
        }

        .fullscreen-button {
            margin-left: auto;
        }

        .bookmarks-bar__list {
            display: none;
            flex: 1 1 auto;
            min-width: 0;
            align-items: center;
            gap: 0.25rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        body.bookmarks-visible .bookmarks-bar__list {
            display: flex;
        }

        .bookmarks-bar__list::-webkit-scrollbar {
            display: none;
        }

        .bookmarks-bar__empty {
            color: var(--color-text);
            font-size: 0.85rem;
            padding: 0.4em 0.6em;
        }

        .bookmarks-item {
            display: flex;
            align-items: center;
            gap: 0.4em;
            padding: 0.35em 0.5em;
            border-radius: 0.3em;
            color: var(--color-text);
            font-size: 0.75rem;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .bookmarks-item:hover,
        .bookmarks-item:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            color: var(--color-text-hover);
            outline: none;
        }

        .bookmarks-item__icon {
            width: 16px;
            height: 16px;
            flex: none;
            border-radius: 3px;
        }

        .bookmarks-item__label {
            flex: 1 1 auto;
            min-width: 0;
            max-width: 7rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            word-spacing: 0.025em;
        }

        .bookmarks-folder__trigger {
            display: flex;
            align-items: center;
            gap: 0.4em;
            font: inherit;
            font-size: 0.75rem;
            border: none;
            background: transparent;
            color: var(--color-text);
            padding: 0.35em 0.5em;
            border-radius: 0.3em;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .bookmarks-folder__icon {
            width: 16px;
            height: 16px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bookmarks-folder__label {
            max-width: 6rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            word-spacing: 0.025em;
        }

        .bookmarks-folder__trigger:hover,
        .bookmarks-folder__trigger:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            color: var(--color-text-hover);
            outline: none;
        }

        .bookmarks-dropdown {
            position: fixed;
            display: none;
            flex-direction: column;
            min-width: 10rem;
            max-width: 16rem;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            padding: 0.3rem;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5em;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.4);
            z-index: 3;
        }

        .bookmarks-folder.open > .bookmarks-dropdown {
            display: flex;
        }

        .bookmarks-dropdown .bookmarks-item {
            max-width: none;
        }

        .bookmarks-dropdown .bookmarks-folder__label {
            max-width: none;
        }

        .bookmarks-dropdown__folder-trigger {
            display: flex;
            align-items: center;
            gap: 0.4em;
            width: 100%;
            font: inherit;
            font-size: 0.75rem;
            border: none;
            background: transparent;
            color: var(--color-text);
            padding: 0.35em 0.5em;
            border-radius: 0.3em;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .bookmarks-dropdown__folder-trigger:hover,
        .bookmarks-dropdown__folder-trigger:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            color: var(--color-text-hover);
            outline: none;
        }

        .bookmarks-dropdown__folder-trigger .bookmarks-folder__label {
            flex: 1 1 auto;
        }

        .bookmarks-dropdown__folder-trigger__chevron {
            flex: none;
            opacity: 0.6;
        }

        .bookmarks-dropdown__empty {
            padding: 0.35em 0.5em;
            color: var(--color-text);
            font-size: 0.75rem;
        }

        .options-menu {
            position: relative;
        }

        .options-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            display: none;
            flex-direction: column;
            min-width: 9rem;
            padding: 0.3rem;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5em;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.4);
            z-index: 3;
        }

        .options-dropdown.open {
            display: flex;
        }

        .options-dropdown__item {
            display: flex;
            align-items: center;
            width: 100%;
            font: inherit;
            font-size: 0.8rem;
            border: none;
            background: transparent;
            color: var(--color-text);
            padding: 0.45em 0.6em;
            border-radius: 0.3em;
            text-align: left;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .options-dropdown__item:hover,
        .options-dropdown__item:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            color: var(--color-text-hover);
            outline: none;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            cursor: default;
            z-index: 10;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: min(22rem, 90vw);
            background: rgba(20, 20, 20, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.6em;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.4);
            color: var(--color-text);
            padding: 1rem 1.2rem 1.2rem;
        }

        .modal__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .modal__header h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-text-hover);
        }

        .modal__close {
            flex: none;
            width: 1.8em;
            height: 1.8em;
        }

        .modal__close svg {
            width: 1rem;
            height: 1rem;
        }

        .modal__body {
            padding: 0.3rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal__option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            padding: 0.5rem 0.1rem;
            cursor: pointer;
        }

        .modal__option input {
            width: 1rem;
            height: 1rem;
            accent-color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        .modal__footer {
            margin-top: 0.75rem;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="top-bar">
        <div class="bookmarks-bar__list" id="bookmarksList"></div>

        <button class="icon-button fullscreen-button" type="button" aria-label="Fullscreen" title="Fullscreen"
            aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" />
            </svg>
        </button>

        <div class="options-menu">
            <button class="icon-button options-toggle" type="button" aria-label="More options" title="More options"
                aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="5" r="1.8" fill="currentColor" stroke="none" />
                    <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none" />
                    <circle cx="12" cy="19" r="1.8" fill="currentColor" stroke="none" />
                </svg>
            </button>
            <div class="options-dropdown">
                <button class="options-dropdown__item" type="button" data-action="settings">Settings</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsOverlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
            <div class="modal__header">
                <h2 id="settingsTitle">Settings</h2>
                <button class="icon-button modal__close" type="button" aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" />
                    </svg>
                </button>
            </div>
            <div class="modal__body">
                <label class="modal__option">
                    <input type="checkbox" id="settingsBookmarksVisible" />
                    <span>Show bookmarks bar</span>
                </label>
            </div>
            <div class="modal__footer" id="settingsVersion"></div>
        </div>
    </div>

    <script src="black-screen.js"></script>
</body>

</html>
