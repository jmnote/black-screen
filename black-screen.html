<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Black Screen</title>
    <link rel="icon" type="image/png" href="images/icon-128.png" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* The only two text/icon colors used anywhere on the page. */
            --color-text: rgba(255, 255, 255, 0.6);
            --color-text-hover: rgba(255, 255, 255, 0.8);
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            cursor: none;
        }

        body.active {
            cursor: default;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 2;
        }

        body.active .top-bar,
        .top-bar:focus-within {
            opacity: 1;
            pointer-events: auto;
            transition-duration: 0.3s;
        }

        .icon-button {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.25em;
            height: 2.25em;
            border: none;
            border-radius: 0.4em;
            background: transparent;
            color: var(--color-text);
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .icon-button svg {
            width: 1.25em;
            height: 1.25em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-button:hover,
        .icon-button:focus-visible,
        .icon-button:active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-text-hover);
            outline: none;
        }

        .fullscreen-button {
            margin-left: auto;
        }

        .bookmarks-bar__list {
            display: none;
            flex: 1 1 auto;
            min-width: 0;
            align-items: center;
            gap: 0.25rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        body.bookmarks-visible .bookmarks-bar__list {
            display: flex;
        }

        html:fullscreen .bookmarks-toggle,
        html:fullscreen .bookmarks-bar__list {
            display: none;
        }

        .bookmarks-bar__list::-webkit-scrollbar {
            display: none;
        }

        .bookmarks-bar__empty {
            color: var(--color-text);
            font-size: 0.85rem;
            padding: 0.4em 0.6em;
        }

        .bookmarks-item {
            display: flex;
            align-items: center;
            gap: 0.4em;
            padding: 0.35em 0.5em;
            border-radius: 0.3em;
            color: var(--color-text);
            font-size: 0.75rem;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .bookmarks-item:hover,
        .bookmarks-item:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            color: var(--color-text-hover);
            outline: none;
        }

        .bookmarks-item__icon {
            width: 16px;
            height: 16px;
            flex: none;
            border-radius: 3px;
        }

        .bookmarks-item__label {
            flex: 1 1 auto;
            min-width: 0;
            max-width: 7rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            word-spacing: 0.025em;
        }

        .bookmarks-folder__trigger {
            display: flex;
            align-items: center;
            gap: 0.4em;
            font: inherit;
            font-size: 0.75rem;
            border: none;
            background: transparent;
            color: var(--color-text);
            padding: 0.35em 0.5em;
            border-radius: 0.3em;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .bookmarks-folder__icon {
            width: 16px;
            height: 16px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bookmarks-folder__label {
            max-width: 6rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            word-spacing: 0.025em;
        }

        .bookmarks-folder__trigger:hover,
        .bookmarks-folder__trigger:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            color: var(--color-text-hover);
            outline: none;
        }

        .bookmarks-dropdown {
            position: fixed;
            display: none;
            flex-direction: column;
            min-width: 10rem;
            max-width: 16rem;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            padding: 0.3rem;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5em;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.4);
            z-index: 3;
        }

        .bookmarks-folder.open > .bookmarks-dropdown {
            display: flex;
        }

        .bookmarks-dropdown .bookmarks-item {
            max-width: none;
        }

        .bookmarks-dropdown .bookmarks-folder__label {
            max-width: none;
        }

        .bookmarks-dropdown__folder-trigger {
            display: flex;
            align-items: center;
            gap: 0.4em;
            width: 100%;
            font: inherit;
            font-size: 0.75rem;
            border: none;
            background: transparent;
            color: var(--color-text);
            padding: 0.35em 0.5em;
            border-radius: 0.3em;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .bookmarks-dropdown__folder-trigger:hover,
        .bookmarks-dropdown__folder-trigger:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            color: var(--color-text-hover);
            outline: none;
        }

        .bookmarks-dropdown__folder-trigger .bookmarks-folder__label {
            flex: 1 1 auto;
        }

        .bookmarks-dropdown__folder-trigger__chevron {
            flex: none;
            opacity: 0.6;
        }

        .bookmarks-dropdown__empty {
            padding: 0.35em 0.5em;
            color: var(--color-text);
            font-size: 0.75rem;
        }
    </style>
</head>

<body>
    <div class="top-bar">
        <button class="icon-button bookmarks-toggle" type="button" aria-label="Bookmarks bar" title="Bookmarks bar"
            aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
            </svg>
        </button>

        <div class="bookmarks-bar__list" id="bookmarksList"></div>

        <button class="icon-button fullscreen-button" type="button" aria-label="Fullscreen" title="Fullscreen"
            aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" />
            </svg>
        </button>
    </div>

    <script src="black-screen.js"></script>
</body>

</html>
